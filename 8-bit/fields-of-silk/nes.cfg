FEATURES { STARTADDRESS: default = $C000; }
SYMBOLS { __STACKSIZE__: type=weak, value=$0100; }
MEMORY {
 ZP: start=$0002, size=$00FE, type=rw, define=yes;
 RAM: start=$0300, size=$0400, type=rw, define=yes;
 HEADER: start=$0000, size=$0010, file=%O, fill=yes;
 PRG: start=$C000, size=$4000, file=%O, fill=yes, fillval=$FF;
 CHR: start=$0000, size=$2000, file=%O, fill=yes;
}
SEGMENTS {
 HEADER: load=HEADER, type=ro;
 STARTUP: load=PRG, type=ro;
 LOWCODE: load=PRG, type=ro, optional=yes;
 ONCE: load=PRG, type=ro, optional=yes;
 CODE: load=PRG, type=ro;
 RODATA: load=PRG, type=ro;
 DATA: load=PRG, run=RAM, type=rw, define=yes;
 BSS: load=RAM, type=bss, define=yes;
 ZEROPAGE: load=ZP, type=zp;
 VECTORS: load=PRG, type=ro, start=$FFFA;
 CHARS: load=CHR, type=ro;
}
